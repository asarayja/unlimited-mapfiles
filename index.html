<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unlimited kart-test</title>
<link rel="stylesheet" href="vendor/leaflet.css">
<style>
  :root { --bg:#0a0e27; --card:#141b2d; --text:#e2e8f0; --muted:#94a3b8; --primary:#6366f1; --border:rgba(255,255,255,.08); }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text); font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  #map { position:absolute; inset:0; background:#1c2b45; }
  .panel { position:absolute; z-index:1000; top:12px; left:12px; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px 14px; box-shadow:0 8px 24px rgba(0,0,0,.35); max-width:290px; }
  .panel h1 { font-size:15px; margin:0 0 8px; }
  .panel h1 b { color:#a5b4fc; }
  .panel h2 { font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin:10px 0 4px; }
  .panel label { display:flex; gap:8px; align-items:center; padding:3px 0; cursor:pointer; }
  .panel input { accent-color:var(--primary); }
  .panel small { color:var(--muted); display:block; margin-top:8px; }
  #pos { position:absolute; z-index:1000; bottom:12px; left:12px; background:var(--card); border:1px solid var(--border); border-radius:8px; padding:6px 10px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .leaflet-control-zoom a { background:var(--card)!important; color:var(--text)!important; border-color:var(--border)!important; }
  @media (max-width:600px){ .panel{ max-width:calc(100% - 48px); } }
</style>
</head>
<body>
<div id="map"></div>
<div class="panel">
  <h1>Unlimited <b>kart-test</b></h1>
  <h2>Grunnkart</h2>
  <label><input type="radio" name="base" value="atlas" checked> Atlas (GTA + Cayo)</label>
  <label><input type="radio" name="base" value="roxwood"> Roxwood (spillkart)</label>
  <h2>Postkoder</h2>
  <label><input type="checkbox" id="p2" checked> GTA</label>
  <label><input type="checkbox" id="prx" checked> Roxwood (bare på Roxwood-kartet)</label>
  <small>Roxwood-postkodene vises bare på Roxwood-kartet. · <a href="rdr2.html" style="color:#a5b4fc">RedM-kart</a></small>
</div>
<div id="pos">X –, Y –</div>
<script src="vendor/leaflet.js"></script>
<script>
// Same projection as Unlimited (html/src/@core/libs/gtaMap.js)
const CRS = L.extend({}, L.CRS.Simple, {
  projection: L.Projection.LonLat,
  scale: z => 2 ** z,
  zoom: s => Math.log(s) / Math.LN2,
  transformation: new L.Transformation(0.01422, 122.9, -0.01424, 146.65),
  infinite: true,
});
const BOUNDS = L.latLngBounds([L.latLng(13000, 8500), L.latLng(-6500, -8800)]);
const opt = { minZoom: 0, maxZoom: 9, maxNativeZoom: 7, bounds: BOUNDS, tileSize: 256 };
const map = L.map('map', { crs: CRS, minZoom: 1, maxZoom: 9, zoomControl: true, attributionControl: false, maxBounds: BOUNDS.pad(0.2) }).setView([2000, -500], 3);
const bases = {
  atlas: L.tileLayer('tiles/atlas_cayo/{z}/{x}/{y}.png', opt),
  roxwood: L.tileLayer('tiles/roxwood/{z}/{x}/{y}.png', opt),
};
const over = {
  p2: L.tileLayer('tiles/postal_02/{z}/{x}/{y}.png', { ...opt, zIndex: 5 }),
  prx: L.tileLayer('tiles/postal_roxwood/{z}/{x}/{y}.png', { ...opt, zIndex: 6 }),
};
let base = bases.atlas.addTo(map), baseName = 'atlas';
const syncs = {};
for (const id in over) {
  const cb = document.getElementById(id);
  // Roxwood postal codes only belong on the Roxwood map
  syncs[id] = () => {
    const allowed = id !== 'prx' || baseName === 'roxwood';
    cb.disabled = !allowed; cb.parentElement.style.opacity = allowed ? 1 : .45;
    (cb.checked && allowed) ? over[id].addTo(map) : map.removeLayer(over[id]);
  };
  cb.onchange = syncs[id]; syncs[id]();
}
document.querySelectorAll('input[name=base]').forEach(r => r.onchange = () => {
  map.removeLayer(base); baseName = r.value; base = bases[r.value].addTo(map); syncs.prx();
});
const pos = document.getElementById('pos');
map.on('mousemove', e => { pos.textContent = `X ${e.latlng.lng.toFixed(0)}, Y ${e.latlng.lat.toFixed(0)}`; });
</script>
</body>
</html>
